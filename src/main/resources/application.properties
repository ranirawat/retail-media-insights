# Spring Boot configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE}

# PostgreSQL - campaign metadata
app.pg.url=${PG_URL}
app.pg.user=${PG_USER}
app.pg.password=${PG_PASSWORD}

# ClickHouse - analytics
app.ch.url=${CH_URL}
app.ch.user=${CH_USER}
app.ch.password=${CH_PASSWORD}

# Actuator
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

# Database connection pools
app.pg.pool-size=8
app.ch.pool-size=8
app.connection-timeout-ms=2000
app.query-timeout-seconds=5
spring.mvc.problemdetails.enabled=true
